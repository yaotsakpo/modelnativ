name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *" # nightly: slow suite
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: fast tests (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: the local-model runtime is not installed by default
        run: test ! -e node_modules/node-llama-cpp
      - run: pnpm typecheck
      - run: pnpm test
      - name: CLI smoke (compile, explain, review, lint)
        run: |
          pnpm mn compile examples/subscription-original/modelnativ/c/plan.change.yaml
          pnpm mn compile --explain examples/subscription-original/modelnativ/c/plan.change.yaml > /dev/null
          pnpm mn review plan.change --app examples/subscription-original/modelnativ/c
          pnpm mn lint examples/subscription-original/modelnativ


  slow:
    name: slow tests (differential, exhaustive concurrency, multi-process)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-slow')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:slow
