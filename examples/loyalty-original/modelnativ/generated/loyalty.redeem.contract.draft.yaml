# CANDIDATE CONTRACT generated by `modelnativ extract` from service.ts:15-41.
# Every TODO must be resolved before it compiles; every REVIEW needs a decision. Nothing here is trusted.
# Checks are in the original order (evaluation: sequential) with the original reason codes.
apiVersion: modelnativ.dev/v1alpha1
kind: Operation
metadata:
  name: loyalty.redeem
  version: 1
  summary: Migrated from RedemptionService.redeem (service.ts:15)
spec:
  input:
    type: object
    additionalProperties: false
    required:
      - rewardId
      - quantity
    properties:
      rewardId:
        type: string
      quantity:
        type: number
      note:
        type: string
  principal:
    required: true
    scopes:
      - loyalty:redeem
  tenancy:
    key: acct.tenantId
    code: not_found
  concurrency:
    mode: serialized_per_resource
    key: request.rewardId
    maxQueue: 1000
  facts:
    - tool: request
      provides:
        - request.rewardId
        - request.quantity
        - request.note
    - tool: loyalty_accounts.acct
      args:
        arg0: principal.subject
        arg1: principal.tenant
      provides:
        - acct.points
        - acct.tier
        - acct.status
        - acct.tenantId
    - tool: rewards.reward
      args:
        arg0: request.rewardId
        arg1: principal.tenant
      provides:
        - reward.cost
        - reward.stock
        - reward.minTier
        - reward.tenantId
    - tool: redemptions.today
      args:
        arg0: principal.subject
      provides:
        - today.n
  authority:
    - id: cap.request   # REVIEW: confirm this source is authoritative
      channel: principal
      predicates:
        - request.*
    - id: cap.loyalty_accounts.acct   # REVIEW: confirm this source is authoritative
      channel: tool:loyalty_accounts.acct
      predicates:
        - acct.*
    - id: cap.rewards.reward   # REVIEW: confirm this source is authoritative
      channel: tool:rewards.reward
      predicates:
        - reward.*
    - id: cap.redemptions.today   # REVIEW: confirm this source is authoritative
      channel: tool:redemptions.today
      predicates:
        - today.*
  decision:
    source:
      mode: fixed
      category: REDEEM
    evaluation: sequential
    categories:
      REDEEM:
        description: The redeem operation
        requires:
          - rule: acct.status == 'active'   # from line 21
            code: inactive
            unestablished:
              outcome: refuse
              code: not_found
          - rule: "TODO: rewrite `TIER_RANK[acct.tier]! < TIER_RANK[reward.min_tier]!` as a comparison over facts"
            code: tier_required
            unestablished:
              outcome: refuse
              code: not_found
          - rule: reward.stock >= request.quantity   # from line 27
            code: out_of_stock
          - rule: "TODO: rewrite `acct.points < total` as a comparison over facts"
            code: insufficient_points
          - rule: "TODO: rewrite `today >= DAILY_LIMIT` as a comparison over facts"
            code: daily_limit
  policy:
    authorization: []
    invariants:
      - "TODO: bound every caller-supplied amount"
  effects:
    loyalty.redeem.apply:
      mode: effectful
      idempotency: required
      args:
        TODO:
          type: string
          authority: established
          from:
            - TODO
  failure:
    onUnverifiable: refuse
    onModelError: refuse
