<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <rect width="900" height="320" rx="16" fill="#ffffff"/>
  <!-- what you write -->
  <text x="30" y="42" font-size="12" font-weight="600" fill="#24292f">What you write</text>
  <rect x="30" y="56" width="200" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="130" y="84" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">plan.change.yaml</text>
  <text x="130" y="103" font-size="10" fill="#57606a" text-anchor="middle">who may act, rules, effects</text>
  <rect x="30" y="176" width="200" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="130" y="204" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">adapters.ts</text>
  <text x="130" y="223" font-size="10" fill="#57606a" text-anchor="middle">the SQL reads and writes</text>
  <!-- modelnativ -->
  <rect x="290" y="30" width="330" height="236" rx="8" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="306" y="52" font-size="12" font-weight="600" fill="#24292f">Modelnativ</text>
  <rect x="320" y="62" width="270" height="58" rx="8" fill="#e7f1fb" stroke="#4a8fd8" stroke-width="1.5"/>
  <text x="455" y="86" font-size="13" font-weight="600" fill="#0a3069" text-anchor="middle">Compiler</text>
  <text x="455" y="104" font-size="10" fill="#0a3069" text-anchor="middle">fills in defaults, validates, fingerprints</text>
  <rect x="320" y="176" width="270" height="70" rx="8" fill="#e7f1fb" stroke="#4a8fd8" stroke-width="1.5"/>
  <text x="455" y="202" font-size="13" font-weight="600" fill="#0a3069" text-anchor="middle">Kernel</text>
  <text x="455" y="220" font-size="10" fill="#0a3069" text-anchor="middle">runs every request against</text>
  <text x="455" y="234" font-size="10" fill="#0a3069" text-anchor="middle">the compiled contract</text>
  <line x1="230" y1="91" x2="318" y2="91" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="230" y1="211" x2="318" y2="211" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="455" y1="120" x2="455" y2="174" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <!-- review -->
  <rect x="680" y="100" width="196" height="96" rx="8" fill="#fdf4d9" stroke="#c9a227" stroke-width="1.5"/>
  <text x="778" y="126" font-size="13" font-weight="600" fill="#5c4400" text-anchor="middle">modelnativ review</text>
  <text x="778" y="145" font-size="10" fill="#5c4400" text-anchor="middle">one screen: rules in order,</text>
  <text x="778" y="159" font-size="10" fill="#5c4400" text-anchor="middle">writes, messages sent, and</text>
  <text x="778" y="173" font-size="10" fill="#5c4400" text-anchor="middle">what it could not verify</text>
  <line x1="620" y1="148" x2="678" y2="148" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="649" y="140" font-size="10" fill="#57606a" text-anchor="middle">reads</text>
  <text x="450" y="296" font-size="11" fill="#57606a" text-anchor="middle">The review is built from the same contract and adapter code the kernel runs, plus recorded test runs.</text>
</svg>
