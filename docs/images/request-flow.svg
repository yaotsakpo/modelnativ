<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="410" rx="16" fill="#ffffff"/>
  <!-- your service -->
  <rect x="20" y="20" width="620" height="340" rx="10" fill="#fafbfc" stroke="#c9ced6" stroke-width="1.5"/>
  <text x="38" y="46" font-size="13" font-weight="600" fill="#24292f">Your service (one process)</text>
  <!-- your app -->
  <rect x="44" y="104" width="150" height="64" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="119" y="130" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Your app</text>
  <text x="119" y="147" font-size="10" fill="#57606a" text-anchor="middle">Express route, or</text>
  <text x="119" y="160" font-size="10" fill="#57606a" text-anchor="middle">modelnativ serve</text>
  <!-- kernel boundary -->
  <rect x="262" y="60" width="354" height="270" rx="8" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="276" y="82" font-size="12" font-weight="600" fill="#24292f">Modelnativ kernel</text>
  <text x="604" y="82" font-size="10" fill="#57606a" text-anchor="end">inside your process</text>
  <!-- contract check -->
  <rect x="300" y="100" width="280" height="76" rx="8" fill="#e7f1fb" stroke="#4a8fd8" stroke-width="1.5"/>
  <text x="440" y="125" font-size="13" font-weight="600" fill="#0a3069" text-anchor="middle">Contract check</text>
  <text x="440" y="145" font-size="10.5" fill="#0a3069" text-anchor="middle">who may act, then each rule in order</text>
  <text x="440" y="161" font-size="10.5" fill="#0a3069" text-anchor="middle">(from plan.change.yaml)</text>
  <!-- request -->
  <line x1="194" y1="136" x2="298" y2="136" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="228" y="128" font-size="10" fill="#57606a" text-anchor="middle">request</text>
  <!-- database -->
  <rect x="44" y="232" width="170" height="70" rx="8" fill="#e9f6ec" stroke="#3a9a4f" stroke-width="1.5"/>
  <text x="129" y="258" font-size="13" font-weight="600" fill="#1a4d25" text-anchor="middle">Your database</text>
  <text x="129" y="276" font-size="10" fill="#1a4d25" text-anchor="middle">your tables, plus the</text>
  <text x="129" y="289" font-size="10" fill="#1a4d25" text-anchor="middle">record of each change</text>
  <path d="M330,178 V267 H216" fill="none" stroke="#333" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="340" y="212" font-size="10" fill="#57606a">reads facts,</text>
  <text x="340" y="226" font-size="10" fill="#57606a">writes in one</text>
  <text x="340" y="240" font-size="10" fill="#57606a">transaction</text>
  <!-- outbox -->
  <rect x="420" y="232" width="170" height="70" rx="8" fill="#fdf4d9" stroke="#c9a227" stroke-width="1.5"/>
  <text x="505" y="258" font-size="13" font-weight="600" fill="#5c4400" text-anchor="middle">Outbox</text>
  <text x="505" y="276" font-size="10" fill="#5c4400" text-anchor="middle">messages saved in the</text>
  <text x="505" y="289" font-size="10" fill="#5c4400" text-anchor="middle">same transaction</text>
  <line x1="505" y1="178" x2="505" y2="230" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="513" y="208" font-size="10" fill="#57606a">if every rule passes</text>
  <!-- external -->
  <rect x="712" y="232" width="168" height="70" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="796" y="258" font-size="13" font-weight="600" fill="#24292f" text-anchor="middle">Billing service</text>
  <text x="796" y="276" font-size="10" fill="#57606a" text-anchor="middle">receives each message</text>
  <text x="796" y="289" font-size="10" fill="#57606a" text-anchor="middle">at least once</text>
  <line x1="590" y1="267" x2="710" y2="267" stroke="#333" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="676" y="259" font-size="10" fill="#57606a" text-anchor="middle">after commit</text>
  <!-- caption -->
  <text x="450" y="390" font-size="11" fill="#57606a" text-anchor="middle">Your tables and outgoing messages are saved together. External calls only leave through the outbox, after the commit.</text>
</svg>
